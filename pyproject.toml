[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemem"
version = "0.1.0"
description = "Local-first, evidence-backed, change-aware shared memory layer for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aryan7098", email = "aryangopinathan07@gmail.com" }
]
keywords = ["falkordb", "graph", "memory", "mcp", "agents", "coding-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "falkordb>=1.8.0",
    "redis>=5.0.0",
    "click>=8.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codemem = "codemem.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/codemem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
