services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: codemem-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  falkordb_data:
    name: codemem_falkordb_data
